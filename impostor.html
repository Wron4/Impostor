        border: none;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.9);
        color: #333;
        text-align: center;

        border: none;
        padding: 15px 30px;
        font-size: 1.2em;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    button:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
    }

    .game-area {
        display: none;
    }

    .players-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 30px;
    }

    .player-card {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 15px;
        padding: 20px;
        text-align: center;
        border: 2px solid transparent;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .player-card:hover {
        border-color: rgba(255, 255, 255, 0.5);
        transform: translateY(-5px);
    }

    .player-card.revealed {
        background: rgba(255, 255, 255, 0.25);
        border-color: #4ecdc4;
    }

    .player-name {
        font-size: 1.3em;
        margin-bottom: 15px;
        font-weight: bold;
    }

    .player-word {
        font-size: 1.8em;
        font-weight: bold;
        min-height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 10px;
        margin-top: 10px;
    }

    .impostor {
        color: #ff6b6b;
    }

    .normal {
        color: #4ecdc4;
    }

    .hidden {
        color: transparent;
        background: rgba(255, 255, 255, 0.3);
    }

    .reset-btn {
        background: linear-gradient(45deg, #4ecdc4, #44a08d);
        margin-top: 30px;
    }

        text-align: center;
        margin-bottom: 20px;
        padding: 15px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 10px;
    }

        opacity: 0.8;

    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }

        0% { transform: scale(1); opacity: 1; }

        100% { transform: scale(1); opacity: 1; }

</style>

    let currentGame = null;

    function generateGame() {
        const playerCount = parseInt(document.getElementById('playerCount').value);
        const hintEnabled = document.getElementById('hintEnabled').checked;
        
        if (playerCount < 3 || playerCount > 10) {
            alert('Liczba graczy musi być między 3 a 10!');
            return;
        }

        // Wybierz losowe słowo
        const wordObj = words[Math.floor(Math.random() * words.length)];
        
        // Wybierz losowego impostora
        const impostorIndex = Math.floor(Math.random() * playerCount);
        
        // Sprawdź czy impostor jest w pierwszych 40%
        const firstFortyPercent = Math.ceil(playerCount * 0.4);
        const impostorGetsHint = hintEnabled && (impostorIndex < firstFortyPercent);
        
        // Wybierz losową podpowiedź z tablicy podpowiedzi
        const randomHint = wordObj.hints[Math.floor(Math.random() * wordObj.hints.length)];

        currentGame = {
            playerCount: playerCount,
            word: wordObj.word,
            // ✨ ✨ ✨ POPRAWKA TUTAJ ✨ ✨ ✨
            hint: randomHint, // Używamy wylosowanej podpowiedzi
            impostorIndex: impostorIndex,
            impostorGetsHint: impostorGetsHint,
            revealedPlayers: new Set()
        };

        // Ukryj setup i pokaż grę
        document.getElementById('setup').style.display = 'none';
        document.getElementById('gameArea').style.display = 'block';

        // Wygeneruj karty graczy
        generatePlayerCards();
    }

    function generatePlayerCards() {
        const grid = document.getElementById('playersGrid');
        grid.innerHTML = '';

        for (let i = 0; i < currentGame.playerCount; i++) {
            const card = document.createElement('div');
            card.className = 'player-card';
            card.onclick = () => togglePlayerCard(i);
            
            const isImpostor = i === currentGame.impostorIndex;
            let displayText = currentGame.word;
            
            if (isImpostor) {
                displayText = currentGame.impostorGetsHint ? currentGame.hint : '???';
            }
            
            card.innerHTML = `
                <div class="player-name">Gracz ${i + 1}</div>
                <div class="player-word hidden" id="word-${i}">
                    ${displayText}
                </div>
                <div class="card-status" id="status-${i}">Kliknij, aby odkryć</div>
            `;
            
            grid.appendChild(card);
        }
    }

    function togglePlayerCard(playerIndex) {
        const card = document.querySelector(`.player-card:nth-child(${playerIndex + 1})`);
        const wordElement = document.getElementById(`word-${playerIndex}`);
        const statusElement = document.getElementById(`status-${playerIndex}`);
        
        if (currentGame.revealedPlayers.has(playerIndex)) {
            // Ukryj kartę
            card.classList.remove('revealed');
            wordElement.classList.add('hidden');
            wordElement.classList.remove('impostor', 'normal');
            statusElement.textContent = 'Kliknij, aby odkryć';
            currentGame.revealedPlayers.delete(playerIndex);
            
            // Animacja ukrywania
            card.style.animation = 'fadeOut 0.5s ease-in-out';
            setTimeout(() => {
                card.style.animation = '';
            }, 500);
        } else {
            // Odkryj kartę
            card.classList.add('revealed');
            wordElement.classList.remove('hidden');
            statusElement.textContent = 'Kliknij, aby ukryć';
            
            if (playerIndex === currentGame.impostorIndex) {
                wordElement.classList.add('impostor');
            } else {
                wordElement.classList.add('normal');
            }
            
            currentGame.revealedPlayers.add(playerIndex);
            
            // Animacja odkrywania
            card.style.animation = 'pulse 0.5s ease-in-out';
            setTimeout(() => {
                card.style.animation = '';
            }, 500);
        }
    }

    function resetGame() {
        document.getElementById('setup').style.display = 'block';
        document.getElementById('gameArea').style.display = 'none';
        currentGame = null;
    }
</script>
