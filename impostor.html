<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra w Impostor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

    body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        color: white;
    }

    .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.2);
        max-width: 800px;
        width: 100%;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
        font-size: 2.5em;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .setup {
        text-align: center;
        margin-bottom: 30px;
    }

    .player-input {
        margin: 20px 0;
    }

    label {
        display: block;
        margin-bottom: 10px;
        font-size: 1.2em;
    }

    input[type="number"] {
        padding: 12px;
        font-size: 1.1em;
        border: none;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.9);
        color: #333;
        text-align: center;
        width: 100px;
    }

    button {
        background: linear-gradient(45deg, #ff6b6b, #ee5a52);
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 1.2em;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    button:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
    }

    .game-area {
        display: none;
    }

    .players-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 30px;
    }

    .player-card {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 15px;
        padding: 20px;
        text-align: center;
        border: 2px solid transparent;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .player-card:hover {
        border-color: rgba(255, 255, 255, 0.5);
        transform: translateY(-5px);
    }

    .player-card.revealed {
        background: rgba(255, 255, 255, 0.25);
        border-color: #4ecdc4;
    }

    .player-name {
        font-size: 1.3em;
        margin-bottom: 15px;
        font-weight: bold;
    }

    .player-word {
        font-size: 1.8em;
        font-weight: bold;
        min-height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 10px;
        margin-top: 10px;
    }

    .impostor {
        color: #ff6b6b;
    }

    .normal {
        color: #4ecdc4;
    }

    .hidden {
        color: transparent;
        background: rgba(255, 255, 255, 0.3);
    }

    .reset-btn {
        background: linear-gradient(45deg, #4ecdc4, #44a08d);
        margin-top: 30px;
    }

    .game-info {
        text-align: center;
        margin-bottom: 20px;
        padding: 15px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 10px;
    }

    .click-instruction {
        font-style: italic;
        opacity: 0.8;
        margin-top: 10px;
    }

    .card-status {
        font-size: 0.9em;
        opacity: 0.8;
        margin-top: 5px;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }

    @keyframes fadeOut {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.95); opacity: 0.7; }
        100% { transform: scale(1); opacity: 1; }
    }
</style>

</head>
<body>
    <div class="container">
        <h1>🕵️ Gra w Impostor</h1>

    <div class="setup" id="setup">
        <div class="player-input">
            <label for="playerCount">Liczba graczy (3-10):</label>
            <input type="number" id="playerCount" min="3" max="10" value="5">
        </div>
        <div class="player-input">
            <label>
                <input type="checkbox" id="hintEnabled" checked style="width: auto; margin-right: 10px;">
                Pomoc dla impostora (podpowiedź dla pierwszych 40%)
            </label>
        </div>
        <button onclick="generateGame()">🎲 Wygeneruj Grę</button>
    </div>

    <div class="game-area" id="gameArea">
        <div class="game-info">
            <h2>Gra została wygenerowana!</h2>
            <p>Każdy gracz powinien kliknąć na swoją kartę, aby zobaczyć swoje słowo.</p>
            <p class="click-instruction">Kliknij ponownie, aby ukryć kartę. Impostor bez podpowiedzi zobaczy "???"</p>
            <p class="click-instruction">Impostor z podpowiedzią (pierwsze 40%) dostaje słowo-wskazówkę!</p>
        </div>
        
        <div class="players-grid" id="playersGrid"></div>
        
        <div style="text-align: center;">
            <button class="reset-btn" onclick="resetGame()">🔄 Nowa Gra</button>
        </div>
    </div>
</div>

<script>
    const words = [
        { word: 'Pizza', hints: ['Jedzenie', 'Włochy', 'Ser', 'Okrągłe'] },
        { word: 'Samochód', hints: ['Pojazd', 'Transport', 'Silnik', 'Droga'] },
        { word: 'Telefon', hints: ['Elektronika', 'Komunikacja', 'Ekran', 'Dzwonek'] },
        { word: 'Książka', hints: ['Papier', 'Czytanie', 'Strony', 'Biblioteka'] },
        { word: 'Komputer', hints: ['Technologia', 'Elektronika', 'Klawiatura', 'Internet'] },
        { word: 'Krzesło', hints: ['Mebel', 'Siedzenie', 'Nogi', 'Dom'] },
        { word: 'Drzewo', hints: ['Natura', 'Roślina', 'Liście', 'Las'] },
        { word: 'Słońce', hints: ['Niebo', 'Światło', 'Ciepło', 'Gwiazda'] },
        { word: 'Morze', hints: ['Woda', 'Fale', 'Plaża', 'Sól'] },
        { word: 'Góra', hints: ['Teren', 'Wysokość', 'Szczyt', 'Wspinaczka'] },
        { word: 'Kot', hints: ['Zwierzę', 'Futro', 'Miauczenie', 'Pazury'] },
        { word: 'Pies', hints: ['Zwierzę', 'Szczekanie', 'Przyjaciel', 'Obroża'] },
        { word: 'Dom', hints: ['Budynek', 'Mieszkanie', 'Dach', 'Rodzina'] },
        { word: 'Szkoła', hints: ['Miejsce', 'Nauka', 'Lekcje', 'Uczniowie'] },
        { word: 'Muzyka', hints: ['Sztuka', 'Dźwięk', 'Melodia', 'Rytm'] },
        { word: 'Film', hints: ['Rozrywka', 'Kino', 'Ekran', 'Aktorzy'] },
        { word: 'Gra', hints: ['Zabawa', 'Rozrywka', 'Zasady', 'Rywalizacja'] },
        { word: 'Sport', hints: ['Aktywność', 'Ruch', 'Trening', 'Drużyna'] },
        { word: 'Jedzenie', hints: ['Żywność', 'Posiłek', 'Smak', 'Kuchnia'] },
        { word: 'Woda', hints: ['Płyn', 'Picie', 'H2O', 'Bezbarwna'] },
        { word: 'Ogień', hints: ['Żywioł', 'Ciepło', 'Płomień', 'Czerwony'] },
        { word: 'Powietrze', hints: ['Gaz', 'Oddychanie', 'Atmosfera', 'Wiatr'] },
        { word: 'Ziemia', hints: ['Planeta', 'Grunt', 'Glob', 'Błękitna'] },
        { word: 'Miłość', hints: ['Uczucie', 'Serce', 'Romans', 'Emocja'] },
        { word: 'Przyjaźń', hints: ['Relacja', 'Więź', 'Zaufanie', 'Towarzystwo'] },
        { word: 'Rodzina', hints: ['Ludzie', 'Krewni', 'Więź', 'Dom'] },
        { word: 'Praca', hints: ['Zajęcie', 'Etat', 'Biuro', 'Zarobek'] },
        { word: 'Hobby', hints: ['Pasja', 'Zainteresowanie', 'Wolny czas', 'Przyjemność'] },
        { word: 'Podróż', hints: ['Ruch', 'Wycieczka', 'Miejsce', 'Walizka'] },
        { word: 'Wakacje', hints: ['Odpoczynek', 'Lato', 'Plaża', 'Urlop'] },
        { word: 'Zima', hints: ['Pora roku', 'Śnieg', 'Mróz', 'Grudzień'] },
        { word: 'Lato', hints: ['Pora roku', 'Upał', 'Słońce', 'Lipiec'] },
        { word: 'Jesień', hints: ['Pora roku', 'Liście', 'Wrzesień', 'Deszcz'] },
        { word: 'Wiosna', hints: ['Pora roku', 'Kwiaty', 'Marzec', 'Ocieplenie'] },
        { word: 'Deszcz', hints: ['Pogoda', 'Krople', 'Parasol', 'Chmury'] },
        { word: 'Śnieg', hints: ['Opady', 'Biały', 'Zima', 'Płatki'] },
        { word: 'Wiatr', hints: ['Powietrze', 'Podmuch', 'Ruch', 'Wiejący'] },
        { word: 'Chmura', hints: ['Niebo', 'Biała', 'Deszcz', 'Puszysty'] },
        { word: 'Gwiazda', hints: ['Kosmos', 'Światło', 'Noc', 'Niebo'] },
        { word: 'Księżyc', hints: ['Satelita', 'Noc', 'Fazy', 'Srebrzysty'] },
        { word: 'Planeta', hints: ['Ciało niebieskie', 'Orbita', 'Kosmos', 'Okrągła'] },
        { word: 'Galaktyka', hints: ['Przestrzeń', 'Gwiazdy', 'Kosmos', 'Droga Mleczna'] },
        { word: 'Wszechświat', hints: ['Wszystko', 'Nieskończoność', 'Kosmos', 'Big Bang'] },
        { word: 'Czas', hints: ['Wymiar', 'Zegar', 'Godziny', 'Upływ'] },
        { word: 'Przestrzeń', hints: ['Miejsce', 'Obszar', 'Wymiar', 'Pusty'] },
        { word: 'Energia', hints: ['Siła', 'Moc', 'Prąd', 'Ruch'] },
        { word: 'Materia', hints: ['Substancja', 'Fizyka', 'Masa', 'Ciało'] },
        { word: 'Atom', hints: ['Cząstka', 'Mały', 'Jądro', 'Fizyka'] },
        { word: 'Cząstka', hints: ['Element', 'Mała', 'Część', 'Atom'] },
        { word: 'Światło', hints: ['Promieniowanie', 'Jasność', 'Lampa', 'Widzenie'] },
        { word: 'Dźwięk', hints: ['Fala', 'Słyszenie', 'Głos', 'Echo'] },
        { word: 'Kolor', hints: ['Barwa', 'Widmo', 'Odcień', 'Tęcza'] },
        { word: 'Forma', hints: ['Kształt', 'Postać', 'Układ', 'Struktura'] },
        { word: 'Rozmiar', hints: ['Wielkość', 'Wymiar', 'Skala', 'Duży/Mały'] },
        { word: 'Waga', hints: ['Masa', 'Ciężar', 'Kilogramy', 'Ważenie'] },
        { word: 'Temperatura', hints: ['Ciepło', 'Stopnie', 'Gorąco/Zimno', 'Termometr'] },
        { word: 'Ciśnienie', hints: ['Siła', 'Atmosfera', 'Nacisk', 'Barometr'] },
        { word: 'Prędkość', hints: ['Tempo', 'Szybkość', 'Kilometr', 'Ruch'] },
        { word: 'Siła', hints: ['Moc', 'Energia', 'Nacisk', 'Fizyka'] }
    ];

    let currentGame = null;

    function generateGame() {
        const playerCount = parseInt(document.getElementById('playerCount').value);
        const hintEnabled = document.getElementById('hintEnabled').checked;
        
        if (playerCount < 3 || playerCount > 10) {
            alert('Liczba graczy musi być między 3 a 10!');
            return;
        }

        // Wybierz losowe słowo
        const wordObj = words[Math.floor(Math.random() * words.length)];
        
        // Wybierz losowego impostora
        const impostorIndex = Math.floor(Math.random() * playerCount);
        
        // Sprawdź czy impostor jest w pierwszych 40%
        const firstFortyPercent = Math.ceil(playerCount * 0.4);
        const impostorGetsHint = hintEnabled && (impostorIndex < firstFortyPercent);
        
        // Wybierz losową podpowiedź z tablicy podpowiedzi
        const randomHint = wordObj.hints[Math.floor(Math.random() * wordObj.hints.length)];

        currentGame = {
            playerCount: playerCount,
            word: wordObj.word,
            // ✨ ✨ ✨ POPRAWKA TUTAJ ✨ ✨ ✨
            hint: randomHint, // Używamy wylosowanej podpowiedzi
            impostorIndex: impostorIndex,
            impostorGetsHint: impostorGetsHint,
            revealedPlayers: new Set()
        };

        // Ukryj setup i pokaż grę
        document.getElementById('setup').style.display = 'none';
        document.getElementById('gameArea').style.display = 'block';

        // Wygeneruj karty graczy
        generatePlayerCards();
    }

    function generatePlayerCards() {
        const grid = document.getElementById('playersGrid');
        grid.innerHTML = '';

        for (let i = 0; i < currentGame.playerCount; i++) {
            const card = document.createElement('div');
            card.className = 'player-card';
            card.onclick = () => togglePlayerCard(i);
            
            const isImpostor = i === currentGame.impostorIndex;
            let displayText = currentGame.word;
            
            if (isImpostor) {
                displayText = currentGame.impostorGetsHint ? currentGame.hint : '???';
            }
            
            card.innerHTML = `
                <div class="player-name">Gracz ${i + 1}</div>
                <div class="player-word hidden" id="word-${i}">
                    ${displayText}
                </div>
                <div class="card-status" id="status-${i}">Kliknij, aby odkryć</div>
            `;
            
            grid.appendChild(card);
        }
    }

    function togglePlayerCard(playerIndex) {
        const card = document.querySelector(`.player-card:nth-child(${playerIndex + 1})`);
        const wordElement = document.getElementById(`word-${playerIndex}`);
        const statusElement = document.getElementById(`status-${playerIndex}`);
        
        if (currentGame.revealedPlayers.has(playerIndex)) {
            // Ukryj kartę
            card.classList.remove('revealed');
            wordElement.classList.add('hidden');
            wordElement.classList.remove('impostor', 'normal');
            statusElement.textContent = 'Kliknij, aby odkryć';
            currentGame.revealedPlayers.delete(playerIndex);
            
            // Animacja ukrywania
            card.style.animation = 'fadeOut 0.5s ease-in-out';
            setTimeout(() => {
                card.style.animation = '';
            }, 500);
        } else {
            // Odkryj kartę
            card.classList.add('revealed');
            wordElement.classList.remove('hidden');
            statusElement.textContent = 'Kliknij, aby ukryć';
            
            if (playerIndex === currentGame.impostorIndex) {
                wordElement.classList.add('impostor');
            } else {
                wordElement.classList.add('normal');
            }
            
            currentGame.revealedPlayers.add(playerIndex);
            
            // Animacja odkrywania
            card.style.animation = 'pulse 0.5s ease-in-out';
            setTimeout(() => {
                card.style.animation = '';
            }, 500);
        }
    }

    function resetGame() {
        document.getElementById('setup').style.display = 'block';
        document.getElementById('gameArea').style.display = 'none';
        currentGame = null;
    }
</script>

</body>
</html>
