<style>
  :root{
    --void:#06060d;
    --ink:#e9ecff;
    --ink-dim:rgba(233,236,255,.55);
    --glass:rgba(255,255,255,.06);
    --glass-edge:rgba(255,255,255,.13);
    --winner:#ffd60a;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  html,body{
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:var(--void);
  }
  body{
    position:fixed; inset:0;
    font-family:'Sora',-apple-system,system-ui,'Segoe UI',sans-serif;
    color:var(--ink);
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{
    position:fixed; inset:0;
    width:100%; height:100%;
    display:block;
    touch-action:none;
    cursor:crosshair;
  }
  /* ---------- overlays ---------- */
  .vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 52%, rgba(2,2,12,.62) 100%);
  }
  #ghost{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    font-family:'Unbounded','Sora',sans-serif; font-weight:800;
    font-size:min(44vmin,420px); line-height:1;
    color:#fff; opacity:0;
  }
  #ghost.show{ animation:ghostPop .85s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes ghostPop{
    0%   { opacity:0;   transform:scale(1.4); }
    14%  { opacity:.11; transform:scale(1.12); }
    100% { opacity:0;   transform:scale(.9); }
  }
  /* ---------- idle title ---------- */
  #titleWrap{
    position:fixed; inset:0; z-index:3; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 24px;
    transition:opacity .55s ease, transform .55s ease;
  }
  #titleWrap.hide{ opacity:0; transform:translateY(-16px) scale(.985); }
  #titleWrap h1{
    font-family:'Unbounded','Sora',sans-serif;
    font-weight:800;
    font-size:clamp(30px, 8vw, 84px);
    letter-spacing:.01em;
    line-height:1.04;
    background:linear-gradient(115deg,#ffffff 0%, #aab6ff 34%, #ff7ad9 64%, #ffd166 96%);
    background-size:220% 220%;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    filter:drop-shadow(0 6px 38px rgba(124,77,255,.35));
    animation:shimmer 7s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%,100%{ background-position:0% 50%; }
    50%    { background-position:100% 50%; }
  }
  #titleWrap .sub{
    margin-top:18px;
    font-size:clamp(14px,3.6vw,17px);
    font-weight:400;
    color:var(--ink-dim);
    letter-spacing:.02em;
    max-width:30ch;
  }
  .dots{ display:flex; gap:14px; margin-top:26px; }
  .dots span{
    width:14px; height:14px; border-radius:50%;
    animation:dotPulse 1.6s ease-in-out infinite;
  }
  .dots span:nth-child(1){ background:#ff3b81; box-shadow:0 0 18px #ff3b81; }
  .dots span:nth-child(2){ background:#00e5ff; box-shadow:0 0 18px #00e5ff; animation-delay:.22s; }
  .dots span:nth-child(3){ background:#ffd60a; box-shadow:0 0 18px #ffd60a; animation-delay:.44s; }
  @keyframes dotPulse{
    0%,100%{ transform:scale(1);   opacity:.55; }
    50%    { transform:scale(1.45); opacity:1; }
  }
  /* ---------- winner banner ---------- */
  #banner{
    position:fixed; left:0; right:0; top:11%; z-index:4; pointer-events:none;
    text-align:center; padding:0 20px;
    opacity:0; transform:scale(.7);
  }
  #banner.show{ animation:winPop .8s cubic-bezier(.18,1.6,.32,1) forwards; }
  #banner.out{ transition:opacity .4s ease, transform .4s ease; opacity:0; transform:scale(.9); }
  @keyframes winPop{
    0%  { opacity:0; transform:scale(.55) translateY(14px); }
    60% { opacity:1; }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }
  #banner h2{
    font-family:'Unbounded','Sora',sans-serif;
    font-weight:800;
    font-size:clamp(34px,10vw,84px);
    letter-spacing:.02em;
    color:var(--winner);
    text-shadow:0 0 22px var(--winner), 0 0 70px var(--winner), 0 4px 30px rgba(0,0,0,.5);
  }
  #banner p{
    margin-top:12px;
    font-size:clamp(13px,3.4vw,16px);
    color:var(--ink-dim);
  }
  /* ---------- top bar ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:6;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
    pointer-events:none;
  }
  .brand{
    font-family:'Unbounded','Sora',sans-serif;
    font-weight:500; font-size:11px;
    letter-spacing:.32em; text-transform:uppercase;
    color:rgba(233,236,255,.5);
  }
  .iconbtn{
    pointer-events:auto;
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--glass);
    border:1px solid var(--glass-edge);
    color:#cdd5ff;
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    touch-action:manipulation;
    cursor:pointer;
    transition:transform .15s ease, background .2s ease;
  }
  .iconbtn:active{ transform:scale(.88); background:rgba(255,255,255,.12); }
  .iconbtn svg{ width:22px; height:22px; }
  /* ---------- status pill ---------- */
  #status{
    position:fixed; left:50%; z-index:5;
    bottom:calc(20px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    padding:11px 22px;
    border-radius:999px;
    background:var(--glass);
    border:1px solid var(--glass-edge);
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    font-size:13.5px; font-weight:600; letter-spacing:.04em;
    color:rgba(233,236,255,.88);
    pointer-events:none;
    white-space:nowrap;
    opacity:0; transition:opacity .35s ease;
  }
  #status.on{ opacity:1; }
  #status.pop{ animation:statusPop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes statusPop{
    0%{ transform:translateX(-50%) scale(.92); }
    55%{ transform:translateX(-50%) scale(1.05); }
    100%{ transform:translateX(-50%) scale(1); }
  }
  @media (prefers-reduced-motion:reduce){
    #titleWrap h1{ animation:none; }
    .dots span{ animation:none; opacity:.8; }
  }
</style>
</head>
<body>

<div class="topbar">

    <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <path d="M16 9l5 6"/><path d="M21 9l-5 6"/>
    </svg>
  </button>

<div id="status"></div>

/* ============================== DOM ============================== */

var subEl    = document.getElementById('subline');

var icoOn    = document.getElementById('icoOn');
var icoOff   = document.getElementById('icoOff');

/* ============================== STATE ============================== */
var W=0, H=0, DPR=1;
var phase = PH.IDLE;

function setRandomTitle() {
  if (mainTitle) {
    mainTitle.textContent = TITLES[Math.floor(Math.random() * TITLES.length)];
  }
}
setRandomTitle();

var stars = [];
var blobs = [];

var spin = null;              // {ids, curi, times[], hop, start, winneri}

var winAt = 0, winEndAt = 0, winStatusShown = false, sparkAt = 0;
var outAt = 0;
var waitPulseAt = 0;
var flash = 0;
var mouseSeq = 0, lastTouchAt = 0;
var touchMode = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============================== UTILS ============================== */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rand(a,b){ return a+Math.random()*(b-a); }
function easeOutCubic(t){ t=clamp(t,0,1); return 1-Math.pow(1-t,3); }
function easeInCubic(t){ t=clamp(t,0,1); return t*t*t; }
function easeOutBack(t){ t=clamp(t,0,1); var c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
function easeInBack(t){ t=clamp(t,0,1); var c1=1.70158,c3=c1+1; return c3*t*t*t-c1*t*t; }
function hexRGB(hex){ var n=parseInt(hex.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgba(hex,a){ var c=hexRGB(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

/* glow sprites (cached radial gradients — fast on Safari, no shadowBlur) */
var spriteCache = {};
function sprite(hex){
  if(spriteCache[hex]) return spriteCache[hex];
  var s = document.createElement('canvas'); s.width = s.height = 256;
  var c = s.getContext('2d');
  var g = c.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,   rgba(hex,.95));
  g.addColorStop(.22, rgba(hex,.5));
  g.addColorStop(.55, rgba(hex,.14));
  g.addColorStop(1,   rgba(hex,0));
  c.fillStyle = g; c.fillRect(0,0,256,256);
  spriteCache[hex] = s; return s;
}
function drawGlow(hex,x,y,d,a){
  if(d<=0||a<=0) return;
  ctx.globalAlpha = clamp(a,0,1);
  ctx.drawImage(sprite(hex), x-d/2, y-d/2, d, d);
  ctx.globalAlpha = 1;
}

/* ============================== AUDIO ============================== */
var actx=null, master=null, muted=false;
function audio(){
  if(!actx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = .5;
    master.connect(actx.destination);
  }
  if(actx.state==='suspended'){ actx.resume(); }
  return actx;
}
function tone(freq,dur,type,vol,delay,slideTo){
  var a=audio(); if(!a||muted) return;
  var t=a.currentTime+(delay||0);
  var o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slideTo){ o.frequency.exponentialRampToValueAtTime(slideTo,t+dur); }
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t+dur+.06);
}
function noiseBurst(dur,vol,delay){
  var a=audio(); if(!a||muted) return;
  var len=Math.floor(a.sampleRate*dur);
  var buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*(1-i/len); }
  var s=a.createBufferSource(); s.buffer=buf;
  var f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=1400;
  var g=a.createGain(); g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(master);
  s.start(a.currentTime+(delay||0));
}
function sndPlace(i){ tone(420+(i%8)*55,.16,'sine',.22); tone(840+(i%8)*55,.09,'triangle',.1,.015); }
function sndLift(){ tone(360,.13,'sine',.12,0,210); }
function sndSec(){ tone(920,.07,'triangle',.2); tone(1840,.05,'sine',.07,.01); }
function sndHop(p){ var f=360*Math.pow(2.5,p); tone(f,.05,'triangle',.16); }
function sndWin(){
  var ch=[523.25,659.25,783.99,1046.5];
  for(var i=0;i<ch.length;i++){ tone(ch[i],.95,'sine',.16,i*.035); }
  tone(2093,.5,'triangle',.07,.08);
  tone(72,.28,'sine',.4,0,38);
  noiseBurst(.4,.18,.02);
}

soundBtn.addEventListener('click', function(e){
  e.stopPropagation();
  muted = !muted;
  icoOn.style.display  = muted ? 'none' : '';
  icoOff.style.display = muted ? '' : 'none';
  soundBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
  if(!muted){ tone(660,.1,'sine',.18); }
});

/* ============================== UI SYNC ============================== */
function setStatus(text){
  if(!text){ statusEl.classList.remove('on'); return; }
  if(statusEl.textContent !== text){
    statusEl.textContent = text;
    statusEl.classList.remove('pop');
    void statusEl.offsetWidth;
    statusEl.classList.add('pop');
  }
  statusEl.classList.add('on');
}
function showGhost(n){
  ghostEl.textContent = n;
  ghostEl.classList.remove('show');
  void ghostEl.offsetWidth;
  ghostEl.classList.add('show');
}
function showBanner(){
  bannerEl.style.setProperty('--winner', winnerColor);
  bannerEl.querySelector('h2').style.color = winnerColor;
  bannerEl.querySelector('h2').style.textShadow =
    '0 0 22px '+winnerColor+', 0 0 70px '+winnerColor+', 0 4px 30px rgba(0,0,0,.5)';

  bannerEl.classList.add('show');
}
function hideBanner(){
  bannerEl.classList.add('out');
  bannerEl.classList.remove('show');
}
function aliveList(){
  var out=[];
  fingers.forEach(function(f){ if(f.state==='alive') out.push(f); });
  return out;
}
function syncUI(){
  var n = aliveList().length;
  titleEl.classList.toggle('hide', phase!==PH.IDLE);
  if(phase===PH.IDLE){
    setStatus('');
    subEl.textContent = touchMode

    setStatus(touchMode ? '1 gracz — dołóżcie palce (min. 2)' : '1 gracz — kliknij, aby dodać więcej');

    setStatus(n+' graczy • losowanie…');

    setStatus('Los decyduje…');
  } else if(phase===PH.WIN){
    if(winStatusShown){
      setStatus(touchMode ? 'Podnieście palce, aby zagrać ponownie' : 'Kliknij, aby zagrać ponownie');

      setStatus('');

    setStatus('');

}

/* ============================== GAME LOGIC ============================== */
function hslToHex(h, s, l) {
  l /= 100;
  var a = s * Math.min(l, 1 - l) / 100;
  function f(n) {
    var k = (n + h / 30) % 12;
    var color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    var hex = Math.round(255 * color).toString(16);
    return hex.length === 1 ? '0' + hex : hex;
  }
  return '#' + f(0) + f(8) + f(4);
}

function pickColor(){
  hueCounter = (hueCounter + 137.5) % 360; // Złoty kąt zapewniający równomierny rozkład kolorów
  var h = Math.floor(hueCounter);
  var s = 85 + Math.floor(Math.random() * 15); // Nasycenie 85-100%
  var l = 55 + Math.floor(Math.random() * 10); // Jasność 55-65%
  return hslToHex(h, s, l);

function spawnRipple(x,y,color,maxR,dur,width,alpha){
  ripples.push({x:x,y:y,color:color,maxR:maxR,dur:dur,width:width,alpha:alpha,start:performance.now()});

function addFinger(id,x,y){

    if(phase===PH.WIN){ spawnRipple(x,y,'#ffffff',70,500,4,.3); }
    return;

  var color = pickColor();
  fingers.set(id,{
    id:id, x:x, y:y, tx:x, ty:y, vx:0, vy:0,
    color:color, born:performance.now(),
    seed:Math.random()*TAU,
    state:'alive', leftAt:0, elimAt:0, hopAt:-1e9

  if(phase===PH.SPIN || phase===PH.WIN || phase===PH.OUT) return;
  var f = fingers.get(id);

  f.state='leaving'; f.leftAt=performance.now();
  sndLift();
  recount();

function moveFinger(id,x,y){
  if(phase===PH.SPIN) return;
  var f = fingers.get(id);
  if(f && (f.state==='alive' || f.state==='winner')){ f.tx=x; f.ty=y; }

function recount(){
  var n = aliveList().length;
  if(n===0){ phase=PH.IDLE; }
  else if(n===1){ phase=PH.WAIT; waitPulseAt=performance.now()+600; }
  else{ phase=PH.COUNT; countStart=performance.now(); countShown=-1; }
  syncUI();
}
function startSpin(){
  var alive = aliveList();
  if(alive.length<2){ recount(); return; }
  var ids = alive.map(function(f){ return f.id; });
  var len = ids.length;
  var curi = Math.floor(Math.random()*len);
  var winneri = Math.floor(Math.random()*len);
  var hops = 10 + Math.floor(Math.random()*4);
  hops += (winneri - ((curi+hops)%len) + len) % len;
  var T = 750 + 110*hops;
  var times = [];
  for(var k=0;k<hops;k++){ times.push(T*Math.pow((k+1)/hops,1.45)); }
  spin = { ids:ids, curi:curi, times:times, hop:0, start:performance.now(), winneri:winneri, hops:hops };
  phase = PH.SPIN;
  syncUI();
}
function triggerWin(){
  var now = performance.now();
  var f = fingers.get(spin.ids[spin.curi]);
  if(!f){ hardReset(); return; }
  winnerId = f.id; winnerColor = f.color;
  f.state='winner';
  winAt = now; winEndAt = 0; winStatusShown = false; sparkAt = now+450;
  var i=0;
  fingers.forEach(function(o){
    if(o.state==='alive'){ o.state='loser'; o.elimAt = now + (i++)*60; }
  });
  /* nova */
  flash = 1;
  var burst = reducedMotion ? 36 : 96;
  for(var p=0;p<burst;p++){
    var ang = Math.random()*TAU;
    var sp = rand(110,580);
    particles.push({
      x:f.x, y:f.y,
      vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
      life:rand(.5,1.15), maxLife:1.15,
      size:rand(2,5.5),
      color:(p%3===0)?'#ffffff':winnerColor,
      drag:.93
    });
  }
  var mx = Math.max(W,H)*.55;
  spawnRipple(f.x,f.y,winnerColor, mx, 900, 14, .8);
  spawnRipple(f.x,f.y,'#ffffff',  mx*.8, 1020, 8, .55);
  spawnRipple(f.x,f.y,winnerColor, mx*1.2, 1200, 5, .35);
  sndWin();
  phase = PH.WIN;
  setTimeout(showBanner, 240);
  if(!touchMode){ winEndAt = winAt + 3000; }
  syncUI();
}
function beginOut(){
  phase = PH.OUT; outAt = performance.now();
  hideBanner();
  syncUI();
}
function hardReset(){
  fingers.clear();
  particles.length = 0;
  ripples.length = 0;
  spin = null; winnerId = null; flash = 0;
  phase = PH.IDLE;
  hideBanner();
  setRandomTitle();
  syncUI();
}

/* ============================== INPUT ============================== */
function cPos(t){
  var r = canvas.getBoundingClientRect();
  return [t.clientX - r.left, t.clientY - r.top];
}
canvas.addEventListener('touchstart', function(e){
  e.preventDefault();
  lastTouchAt = performance.now(); touchMode = true;
  audio();
  for(var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i], p = cPos(t);
    rawTouches.add(t.identifier);
    addFinger(t.identifier, p[0], p[1]);
  }
  if(phase===PH.WIN){ winEndAt = 0; }
}, {passive:false});
canvas.addEventListener('touchmove', function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i], p = cPos(t);
    moveFinger(t.identifier, p[0], p[1]);
  }
}, {passive:false});
function touchEnd(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    rawTouches.delete(t.identifier);
    removeFinger(t.identifier);
  }
  if(phase===PH.WIN && rawTouches.size===0 && !winEndAt){
    winEndAt = Math.max(performance.now(), winAt+1100) + 750;
  }
}
canvas.addEventListener('touchend', touchEnd, {passive:false});
canvas.addEventListener('touchcancel', touchEnd, {passive:false});

/* desktop fallback: clicks toggle simulated fingers */
canvas.addEventListener('click', function(e){
  if(touchMode && performance.now()-lastTouchAt < 1200) return;
  audio();
  var p = cPos(e);
  if(phase===PH.WIN){ beginOut(); return; }
  if(phase===PH.SPIN || phase===PH.OUT) return;
  var hit = null;
  fingers.forEach(function(f){
    if(f.state==='alive' && Math.hypot(f.x-p[0], f.y-p[1]) < R*1.5){ hit = f.id; }
  });
  if(hit!==null){ removeFinger(hit); }
  else{ addFinger('m'+(mouseSeq++), p[0], p[1]); }
});
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); });

/* ============================== WORLD ============================== */
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = Math.round(W*DPR);
  canvas.height = Math.round(H*DPR);
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  R = clamp(Math.min(W, H) * 0.085, 26, 46);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize,120); });
resize();

for(var s=0;s<70;s++){
  stars.push({ x:Math.random(), y:Math.random(), r:rand(.6,1.8), ph:Math.random()*TAU, sp:rand(.4,1.4) });
}
blobs = [
  { c:'#3b1d6e', a:.4,  px:.22, py:.3,  rx:.2,  ry:.16, sp:.00006, ph:0,   sz:.85 },
  { c:'#12345f', a:.38, px:.78, py:.7,  rx:.18, ry:.2,  sp:.00005, ph:2.1, sz:.95 },
  { c:'#0e4a45', a:.3,  px:.55, py:.18, rx:.22, ry:.14, sp:.00007, ph:4.2, sz:.7  }
];

/* ============================== UPDATE ============================== */
function update(now, dt){
  /* finger position bouncy spring + lifecycle cleanup */
  var tension = 300;
  var friction = 14;
  var toDelete = [];
  fingers.forEach(function(f){
    var ax = (f.tx - f.x) * tension - f.vx * friction;
    var ay = (f.ty - f.y) * tension - f.vy * friction;
    f.vx += ax * dt;
    f.vy += ay * dt;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    var dot = (f.x - f.tx) * f.vx + (f.y - f.ty) * f.vy;
    if(f.prevDot > 0 && dot <= 0){
      var d2 = (f.x - f.tx)*(f.x - f.tx) + (f.y - f.ty)*(f.y - f.ty);
      if(d2 > 64){
        spawnRipple(f.x, f.y, f.color, 75, 650, 3.5, 0.45);
      }
    }
    f.prevDot = dot;
    if(f.state==='leaving' && now-f.leftAt > 340){ toDelete.push(f.id); }
    if(f.state==='loser'   && now-f.elimAt > 620){ toDelete.push(f.id); }
  });
  for(var i=0;i<toDelete.length;i++){ fingers.delete(toDelete[i]); }

  if(phase===PH.WAIT){
    // Usunięto ciągłe pulsowanie, zostawiamy tylko fizykę odbijania
  }
  else if(phase===PH.COUNT){
    var p = (now-countStart)/COUNT_MS;
    var idx = Math.floor(p*3);
    if(idx!==countShown && idx<3){
      countShown = idx;
      showGhost(3-idx);
      sndSec();
    }
    if(p>=1){ startSpin(); }
  }
  else if(phase===PH.SPIN && spin){
    var el = now - spin.start;
    while(spin.hop < spin.hops && el >= spin.times[spin.hop]){
      spin.curi = (spin.curi+1) % spin.ids.length;
      var prog = spin.hop / spin.hops;
      sndHop(prog);
      var hf = fingers.get(spin.ids[spin.curi]);
      if(hf){ hf.hopAt = now; spawnRipple(hf.x,hf.y,'#ffffff',64,360,4,.5); }
      spin.hop++;
      if(spin.hop>=spin.hops){ triggerWin(); break; }
    }
  }
  else if(phase===PH.WIN){
    if(!winStatusShown && now > winAt+1100){ winStatusShown=true; syncUI(); }
    /* orbiting sparkles around the winner */
    var wf = fingers.get(winnerId);
    if(wf && now>sparkAt && particles.length<500){
      sparkAt = now + (reducedMotion?220:90);
      var a = Math.random()*TAU, rr = R*1.55;
      particles.push({
        x:wf.x+Math.cos(a)*rr, y:wf.y+Math.sin(a)*rr,
        vx:-Math.sin(a)*rand(30,80)+Math.cos(a)*20,
        vy: Math.cos(a)*rand(30,80)+Math.sin(a)*20,
        life:rand(.45,.85), maxLife:.85,
        size:rand(1.5,3), color:(Math.random()<.4)?'#ffffff':winnerColor, drag:.96
      });
    }
    if(!touchMode && winEndAt && now>winEndAt){ beginOut(); }
    if(touchMode && winEndAt && rawTouches.size===0 && now>winEndAt){ beginOut(); }
  }
  else if(phase===PH.OUT){
    if(now-outAt > 560){ hardReset(); }
  }

  /* particles */
  for(var k=particles.length-1;k>=0;k--){
    var pt = particles[k];
    pt.life -= dt;
    if(pt.life<=0){ particles.splice(k,1); continue; }
    var dr = Math.pow(pt.drag, dt*60);
    pt.vx*=dr; pt.vy*=dr;
    pt.x += pt.vx*dt; pt.y += pt.vy*dt;
  }
  /* ripples */
  for(var r2=ripples.length-1;r2>=0;r2--){
    if(now-ripples[r2].start > ripples[r2].dur){ ripples.splice(r2,1); }
  }
  if(flash>0){ flash = Math.max(0, flash - dt*2.1); }
}

/* ============================== RENDER ============================== */
function fingerScale(f, now){
  var s;
  if(f.state==='leaving'){
    s = 1 - easeInCubic((now-f.leftAt)/320);
  } else if(f.state==='loser'){
    var t = (now-f.elimAt)/560;
    s = t<0 ? 1 : 1 - easeInBack(t);
  } else if(f.state==='winner'){
    s = lerp(1, 1.32, easeOutBack((now-winAt)/650));
  } else {
    s = easeOutBack((now-f.born)/380);
  }
  return Math.max(0, s);
}
function drawFinger(f, now){
  var s = fingerScale(f, now);
  if(s<=.02) return;

  var amp=.035, freq=1.1;
  if(phase===PH.COUNT){
    var cp = clamp((now-countStart)/COUNT_MS,0,1);
    amp = lerp(.035,.09,cp); freq = lerp(1.2,3.2,cp);
  }
  if(f.state==='winner'){ amp=.05; freq=1.7; }
  var pulse = 1 + amp*Math.sin(now/1000*freq*TAU + f.seed);
  var sc = s*pulse;
  var hop = Math.exp(-(now-f.hopAt)/130);
  if(hop>.01){ sc *= 1 + .22*hop; }

  var dim = 1;
  if(phase===PH.SPIN && spin && f.id!==spin.ids[spin.curi]){ dim=.4; }
  var x=f.x, y=f.y, c=f.color;
  var alphaMul = (f.state==='loser') ? clamp(1-(now-f.elimAt)/560,0,1) : 1;

  /* glow layers */
  ctx.globalCompositeOperation='lighter';
  drawGlow(c, x, y, R*4.9*sc, .8*dim*alphaMul);
  drawGlow(c, x, y, R*2.0*sc, .55*dim*alphaMul);
  if(f.state==='winner'){
    var halo = 1 + .12*Math.sin(now/300);
    drawGlow(c, x, y, R*8.2*sc*halo, .4);
    drawGlow('#ffffff', x, y, R*2.4*sc, .3);
  }
  if(phase===PH.SPIN && spin && f.id===spin.ids[spin.curi]){
    drawGlow('#ffffff', x, y, R*5.4*sc, .55);
  }
  ctx.globalCompositeOperation='source-over';

  ctx.globalAlpha = dim*alphaMul;

  /* main ring */
  ctx.strokeStyle = c; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x,y,R*sc,0,TAU); ctx.stroke();

  /* rotating dashed arcs */
  ctx.save();
  ctx.lineWidth = 4; ctx.lineCap='round';
  ctx.setLineDash([26,16]);
  ctx.lineDashOffset = -now/14;
  ctx.strokeStyle = rgba(c,.9);
  ctx.beginPath(); ctx.arc(x,y,R*1.24*sc,0,TAU); ctx.stroke();
  ctx.lineDashOffset = now/19;
  ctx.setLineDash([14,22]);
  ctx.strokeStyle = rgba('#ffffff',.45);
  ctx.beginPath(); ctx.arc(x,y,R*1.46*sc,0,TAU); ctx.stroke();
  ctx.restore();

  /* spin highlight ring */
  if(phase===PH.SPIN && spin && f.id===spin.ids[spin.curi]){
    ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(x,y,R*1.7*sc,0,TAU); ctx.stroke();
  }

  /* winner crown rings */
  if(f.state==='winner'){
    ctx.save();
    ctx.lineCap='round';
    ctx.setLineDash([8,30]);
    ctx.lineDashOffset = -now/8;
    ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(x,y,R*1.75*sc,0,TAU); ctx.stroke();
    ctx.setLineDash([4,44]);
    ctx.lineDashOffset = now/10;
    ctx.strokeStyle = rgba(c,.7); ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y,R*2.1*sc,0,TAU); ctx.stroke();
    ctx.restore();
  }

  /* countdown progress arc */
  if(phase===PH.COUNT && f.state==='alive'){
    var prog = clamp((now-countStart)/COUNT_MS,0,1);
    var ar = R*1.62*s;
    ctx.strokeStyle = rgba('#ffffff',.12); ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(x,y,ar,0,TAU); ctx.stroke();
    ctx.strokeStyle = c; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(x,y,ar,-Math.PI/2,-Math.PI/2+prog*TAU); ctx.stroke();
    var tx = x+Math.cos(-Math.PI/2+prog*TAU)*ar;
    var ty = y+Math.sin(-Math.PI/2+prog*TAU)*ar;
    ctx.globalCompositeOperation='lighter';
    drawGlow('#ffffff',tx,ty,26,.9);
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(tx,ty,3.4,0,TAU); ctx.fill();
  }

  ctx.globalAlpha = 1;
}
function drawConstellation(now){
  if(!(phase===PH.COUNT || phase===PH.SPIN)) return;
  var alive=[];
  fingers.forEach(function(f){ if(f.state==='alive'||f.state==='winner') alive.push(f); });
  if(alive.length<2) return;
  var maxD = Math.min(W,H)*.85;
  var beat = (phase===PH.COUNT) ? (.7+.3*Math.sin(now/180)) : .45;
  ctx.globalCompositeOperation='lighter';
  ctx.lineWidth=2;
  for(var i=0;i<alive.length;i++){
    for(var j=i+1;j<alive.length;j++){
      var a=alive[i], b=alive[j];
      var d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d>maxD) continue;
      var al=(1-d/maxD)*.16*beat;
      var g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
      g.addColorStop(0, rgba(a.color,al));
      g.addColorStop(1, rgba(b.color,al));
      ctx.strokeStyle=g;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation='source-over';
}
function render(now){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#06060d';
  ctx.fillRect(0,0,W,H);

  /* ambient blobs */
  var bigR = Math.max(W,H);
  for(var b=0;b<blobs.length;b++){
    var bl=blobs[b];
    var bx=(bl.px + Math.cos(now*bl.sp+bl.ph)*bl.rx)*W;
    var by=(bl.py + Math.sin(now*bl.sp*1.2+bl.ph)*bl.ry)*H;
    var br=bigR*bl.sz*.62;
    var g=ctx.createRadialGradient(bx,by,0,bx,by,br);
    g.addColorStop(0, rgba(bl.c, bl.a));
    g.addColorStop(1, rgba(bl.c, 0));
    ctx.fillStyle=g;
    ctx.fillRect(bx-br,by-br,br*2,br*2);
  }
  /* winner afterglow tint */
  if(phase===PH.WIN || phase===PH.OUT){
    var wf=fingers.get(winnerId);
    var wx=wf?wf.x:W/2, wy=wf?wf.y:H/2;
    var wr=bigR*.8;
    var wg=ctx.createRadialGradient(wx,wy,0,wx,wy,wr);
    var wa=.16+.05*Math.sin(now/420);
    wg.addColorStop(0, rgba(winnerColor, wa));
    wg.addColorStop(1, rgba(winnerColor, 0));
    ctx.fillStyle=wg;
    ctx.fillRect(0,0,W,H);
  }

  /* stars */
  ctx.globalCompositeOperation='lighter';
  for(var st=0;st<stars.length;st++){
    var sObj=stars[st];
    var tw=.06+.16*(.5+.5*Math.sin(now/1000*sObj.sp*TAU+sObj.ph));
    ctx.globalAlpha=tw;
    ctx.fillStyle='#cfd8ff';
    ctx.beginPath(); ctx.arc(sObj.x*W,sObj.y*H,sObj.r,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';

  drawConstellation(now);

  /* ripples */
  ctx.globalCompositeOperation='lighter';
  for(var r=0;r<ripples.length;r++){
    var rp=ripples[r];
    var t=clamp((now-rp.start)/rp.dur,0,1);
    var rr=easeOutCubic(t)*rp.maxR;
    ctx.globalAlpha=(1-t)*rp.alpha;
    ctx.strokeStyle=rp.color;
    ctx.lineWidth=lerp(rp.width,1,t);
    ctx.beginPath(); ctx.arc(rp.x,rp.y,rr,0,TAU); ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';

  /* fingers */
  fingers.forEach(function(f){ drawFinger(f, now); });

  /* particles */
  ctx.globalCompositeOperation='lighter';
  for(var p=0;p<particles.length;p++){
    var pt=particles[p];
    var la=clamp(pt.life/pt.maxLife,0,1);
    ctx.globalAlpha=la;
    ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.size*la+0.4,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';

  /* flash */
  if(flash>0){
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=flash*.22;
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
  }
  /* fade-out to idle */
  if(phase===PH.OUT){
    var ot=clamp((now-outAt)/560,0,1);
    ctx.globalAlpha=easeInCubic(ot);
    ctx.fillStyle='#06060d';
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }
}

/* ============================== LOOP ============================== */
var last=performance.now();
function frame(now){
  var dt=Math.min(50, now-last)/1000;
  last=now;
  update(now,dt);
  render(now);
  requestAnimationFrame(frame);
}
syncUI();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
